# Nginx 配置 —— HTTPS 静态托管
#
# 前提：
#   1. 域名 A 记录已指向服务器；
#   2. 80/443 已放行；
#   3. 已用 certbot 申请证书（见下方命令）。
#
# 首次申请证书：
#   sudo apt install nginx certbot python3-certbot-nginx -y
#   sudo certbot --nginx -d zhengwen.example.com
#
# 安装站点：
#   sudo cp nginx-zhengwen.conf /etc/nginx/sites-available/zhengwen
#   sudo ln -s /etc/nginx/sites-available/zhengwen /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name zhengwen.example.com;

    # certbot 会自动把 80 重定向到 443；未申请证书前保留这一行便于验证
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name zhengwen.example.com;

    # certbot 申请后会自动写入这两行；若手动配置请改成你的证书路径
    # ssl_certificate     /etc/letsencrypt/live/zhengwen.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/zhengwen.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    root /var/www/zhengwen;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.deepseek.com; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    # 内容清单与提示词不缓存，方便换文件后立即生效
    location = /content.json {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location /prompts/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Service Worker 不缓存
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|woff2)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    access_log /var/log/nginx/zhengwen.access.log;
    error_log  /var/log/nginx/zhengwen.error.log;
}
