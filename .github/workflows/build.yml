name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Go 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -v -count=1 ./...

  cross-build:
    name: 交叉编译
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            output: politicsqa-windows-amd64.exe
          - goos: linux
            goarch: amd64
            output: politicsqa-linux-amd64
          - goos: darwin
            goarch: arm64
            output: politicsqa-darwin-arm64
          - goos: darwin
            goarch: amd64
            output: politicsqa-darwin-amd64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags="-s -w" -o ${{ matrix.output }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}
          if-no-files-found: error

  web-bundles:
    name: 前端构建产物
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装测试依赖
        run: npm install --no-fund --no-audit --no-save jsdom

      - name: 前端单元测试
        run: node test/unit.mjs

      - name: 构建单文件版
        run: node build-standalone.mjs

      - name: 构建静态托管版
        run: node build-static.mjs

      - name: 校验产物存在
        run: |
          test -f web/政问-单文件版.html
          test -f dist/index.html
          test -f dist/content.json
          test -f dist/prompts/01-课程讲解.txt
          echo "single-file: $(du -h web/政问-单文件版.html | cut -f1)"
          echo "dist files: $(find dist -type f | wc -l)"

      - name: 文档链接自检
        run: node scripts/check-links.mjs

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-bundles
          path: |
            web/政问-单文件版.html
            dist/
          if-no-files-found: error
